name: Scheduled Checks

# 外部サービスの応答を待つ検証をここへ集める。
# これらが失敗する原因はほぼ常に外部側の変化であって PR の変更ではないため、
# PR ごと・デプロイごとに実行すると待ち時間を毎回払うだけになる。
on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-checks
  cancel-in-progress: true

jobs:
  external:
    name: External Dependency Checks
    # feature branchの手動実行はStripe sandboxの変更証跡に使い、prd Environmentへは接続しない。
    if: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # LINE の疎通確認に本番のチャネルアクセストークンとドメインを使う。
    environment: prd
    env:
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      # ドキュメント内の外部 URL を取得しにいくため、応答待ちが実行時間の大半を占める。
      # 相対リンクは PR の `ci.yml` が見るので、ここは外部 URL の劣化検知が目的。
      - name: Markdown External Link Check
        run: bun run lint:md:links

      # CD は URL が変わらない限り疎通確認を省くため、LINE Platform から本番 Webhook へ
      # 実際に到達できるかはここで定期的に確かめる (`--force` で疎通確認まで実行する)。
      - name: Verify Production LINE Webhook Connectivity
        if: ${{ env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        run: bun --cwd apps/api scripts/register-webhook.ts --force

      # GETだけを使い、manifestと実resourceの欠落・置換・設定差分を週次検知する。
      - name: Verify Production Cloudflare Infrastructure Drift
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: bun scripts/verify-cloudflare-infrastructure.ts production

  stripe-sandbox:
    name: Stripe Sandbox Billing Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - name: Require Stripe Sandbox Secret
        run: test -n "$STRIPE_SECRET_KEY"

      # Test Clockを使う実接続E2Eは通常PRのCIから分離し、dev sandboxだけで実行する。
      - name: Verify Stripe Sandbox Billing Lifecycle
        run: bun --cwd apps/api billing:test:sandbox
