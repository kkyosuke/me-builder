name: CI / E2E

# E2E は実行時間の大半を占めるため、通常の CI (`ci.yml`) とは別jobで実行する。
# mainへ入る前に回帰を検出できるよう、すべてのPR更新で必須実行する。
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      # `ci.yml` が実行しない E2E と Worker runtime E2E だけを走らせる (検証の重複を作らない)。
      - name: Run E2E Tests
        run: bun run test:e2e
