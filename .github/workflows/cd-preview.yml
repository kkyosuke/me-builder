name: CD / Preview

on:
  # プレビューは共有環境 (stg.kagami.kyosuke.dev) のため、全 PR で自動デプロイはしない。
  # デプロイするのは次の 2 通りだけ。
  #   1. Actions 画面 / `gh workflow run` でブランチを指定した手動実行
  #   2. `deploy` ラベルが付いた PR (ラベル付与時と、その後の push)
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: read
  # デプロイ完了コメントを PR へ投稿するために必要
  pull-requests: write

# 共有環境への同時デプロイを直列化する。実行中のデプロイは途中で止めず、
# 待機中の実行だけが新しいものへ置き換わる。
concurrency:
  group: cd-preview
  cancel-in-progress: false

jobs:
  deploy-preview:
    name: Deploy Preview Environment
    # 手動実行は無条件。PR 起因の場合は `deploy` ラベルが付いているときだけ。
    # `synchronize` でも同じ条件を見るため、ラベルを剥がせば以降の push ではデプロイされない。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub上ではデプロイ専用Secretとして管理し、CLIが要求する標準名へここだけで写す。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      CLOUDFLARE_APP_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_API_TOKEN }}
      CHAT_DELIVERY_SECRET: ${{ secrets.CHAT_DELIVERY_SECRET }}
      CLOUDFLARE_AI_GATEWAY_ID: ${{ vars.CLOUDFLARE_AI_GATEWAY_ID }}
      ADMIN_LINE_USER_IDS: ${{ secrets.ADMIN_LINE_USER_IDS }}
      # LIFF Server API は LINE Login チャネルのチャネルアクセストークンを要求する。
      # LINE_LOGIN_CHANNEL_ID は未設定でも LIFF ID の接頭辞から補完される。
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      LINE_LOGIN_CHANNEL_SECRET: ${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      VITE_ENVIRONMENT: preview
      VITE_BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      # Vite は GitHub Actions 上のビルドで値を埋め込むため、LIFF ID は Pages 側ではなくここで渡す。
      # 未設定の場合は LIFF 初期化がスキップされる (画面は壊れない)。
      VITE_LIFF_ID: ${{ vars.LIFF_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI Verification
        run: bun run ci

      - name: Ensure Queues (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task queues:setup:preview

      - name: Apply D1 Migrations (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task db:migrate:preview

      - name: Apply Diagnosis Seed (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task db:seed:preview

      - name: Deploy to Cloudflare Preview
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          LIFF_ID: ${{ vars.LIFF_ID }}
        run: |
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Secrets に設定されていません。x-line-signature の検証に必須です。"
            exit 1
          fi
          if [ -z "${CHAT_DELIVERY_SECRET}" ]; then
            echo "::error::CHAT_DELIVERY_SECRET が GitHub Secrets に設定されていません。日記チャットの重複配送防止に必須です。"
            exit 1
          fi

          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/worker-secrets.XXXXXX")"
          api_secrets_file="${secrets_dir}/api.json"
          worker_secrets_file="${secrets_dir}/worker.json"
          trap 'rm -f "${api_secrets_file}" "${worker_secrets_file}"; rmdir "${secrets_dir}"' EXIT

          API_SECRETS_FILE="${api_secrets_file}" WORKER_SECRETS_FILE="${worker_secrets_file}" bun -e '
            const sharedSecrets = [["LINE_CHANNEL_ACCESS_TOKEN", process.env.LINE_CHANNEL_ACCESS_TOKEN], ["LIFF_ID", process.env.LIFF_ID], ["ADMIN_LINE_USER_IDS", process.env.ADMIN_LINE_USER_IDS], ["CLOUDFLARE_APP_API_TOKEN", process.env.CLOUDFLARE_APP_API_TOKEN]];
            const optionalSecrets = Object.fromEntries(
              sharedSecrets
                .filter(([, value]) => value),
            );
            const workerOnlySecrets = Object.fromEntries(
              [["GOOGLE_AI_STUDIO_API_KEY", process.env.GOOGLE_AI_STUDIO_API_KEY], ["CHAT_DELIVERY_SECRET", process.env.CHAT_DELIVERY_SECRET]]
                .filter(([, value]) => value),
            );
            await Bun.write(process.env.API_SECRETS_FILE, JSON.stringify({
              LINE_CHANNEL_SECRET: process.env.LINE_CHANNEL_SECRET,
              CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
              CLOUDFLARE_AI_GATEWAY_ID: process.env.CLOUDFLARE_AI_GATEWAY_ID || "default",
              ...optionalSecrets,
            }));
            await Bun.write(process.env.WORKER_SECRETS_FILE, JSON.stringify({
              ...optionalSecrets,
              ...workerOnlySecrets,
            }));
          '

          bun --cwd apps/worker wrangler deploy --env preview --secrets-file "${worker_secrets_file}"
          bun --cwd apps/api wrangler deploy --env preview --secrets-file "${api_secrets_file}"
          bun --filter @me-builder/mcp deploy:preview
          bun --filter @me-builder/web deploy:preview

      - name: Register LINE Webhook (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          bun --cwd apps/api scripts/register-webhook.ts

      - name: Verify Gemini Connectivity (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun --cwd apps/worker run check:gemini "Reply with OK."

      - name: Verify AI Gateway Analytics Connectivity (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: bun --cwd apps/api run check:analytics

      # デプロイ済みの URL を LIFF アプリのエンドポイント URL へ反映する
      - name: Register LIFF Endpoint (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_LOGIN_CHANNEL_SECRET != '' }}
        run: |
          bun --cwd apps/web scripts/register-liff.ts preview

      - name: Register LINE Rich Menu (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        env:
          LIFF_ID: ${{ vars.LIFF_ID }}
        run: bun --cwd apps/api run register:rich-menu:preview



      - name: Skip Deployment Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_DEPLOY_API_TOKEN が GitHub Secrets に設定されていないためデプロイをスキップしました。"

      # 手動実行では紐づく PR が無いため、まず実行サマリーへリンクを出力する
      - name: Publish Deployment Summary
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          DEPLOY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          DEPLOY_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "### 🚀 プレビュー環境へのデプロイが完了しました！"
            echo
            echo "ブランチ \`${DEPLOY_REF}\` のコミット (\`${DEPLOY_SHA:0:7}\`) のビルド・デプロイが成功しました。"
            echo
            echo "| サービス | リンク |"
            echo "| --- | --- |"
            echo "| 🖥️ **Web UI** | [stg.kagami.kyosuke.dev](https://stg.kagami.kyosuke.dev) |"
            echo "| ⚡ **API Server** | [api.stg.kagami.kyosuke.dev](https://api.stg.kagami.kyosuke.dev) |"
            echo "| 🤖 **MCP Server** | [mcp.stg.kagami.kyosuke.dev](https://mcp.stg.kagami.kyosuke.dev) |"
            echo "| ☁️ **Cloudflare Dashboard** | [Workers & Pages を開く](https://dash.cloudflare.com/${CLOUDFLARE_ACCOUNT_ID}/workers-and-pages) |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # `deploy` ラベル経由の実行では、同じ内容を PR へコメントする
      - name: Comment Preview Deployment on PR
        uses: actions/github-script@v7
        if: ${{ github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != '' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const identifier = '<!-- preview-deploy-comment -->';
            const cloudflareDashboardUrl = `https://dash.cloudflare.com/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers-and-pages`;
            const headSha = context.payload.pull_request.head.sha;

            // 1. 既存のプレビューデプロイコメントを削除 (古いコメントを削除して再投稿)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            for (const comment of comments.data) {
              if (comment.body && comment.body.includes(identifier)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // 2. 新しいプレビュー完了コメントを投稿
            const body = `${identifier}
            ### 🚀 プレビュー環境へのデプロイが完了しました！

            \`deploy\` ラベルが付いているため、最新コミット (\`${headSha.substring(0, 7)}\`) のビルド・デプロイを実行しました。

            | サービス | リンク |
            | --- | --- |
            | 🖥️ **Web UI** | [stg.kagami.kyosuke.dev](https://stg.kagami.kyosuke.dev) |
            | ⚡ **API Server** | [api.stg.kagami.kyosuke.dev](https://api.stg.kagami.kyosuke.dev) |
            | 🤖 **MCP Server** | [mcp.stg.kagami.kyosuke.dev](https://mcp.stg.kagami.kyosuke.dev) |
            | ☁️ **Cloudflare Dashboard** | [Workers & Pages を開く](${cloudflareDashboardUrl}) |

            > プレビューは全 PR 共有の単一環境です。ラベルを外しても環境は元に戻りません。
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: body,
            });
