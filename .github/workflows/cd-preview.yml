name: CD / Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy-preview:
    name: Deploy Preview Environment
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      VITE_BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI Verification
        run: bun run ci

      - name: Apply D1 Migrations (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task db:migrate:preview

      - name: Deploy to Cloudflare Preview
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task deploy:preview

      - name: Sync Secrets to Cloudflare Workers (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        run: |
          echo "${LINE_CHANNEL_ACCESS_TOKEN}" | bun --cwd apps/api wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --env preview
          echo "${LINE_CHANNEL_ACCESS_TOKEN}" | bun --cwd apps/worker wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --env preview

      # x-line-signature の検証を行う apps/api にのみチャネルシークレットを配布する。
      # 未設定だと環境を問わず全ての Webhook リクエストが 401 になるため、
      # 設定漏れをエラーとして扱いデプロイを失敗させる
      - name: Sync LINE Channel Secret to Cloudflare Workers (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Secrets に設定されていません。x-line-signature の検証に必須です。"
            exit 1
          fi
          echo "${LINE_CHANNEL_SECRET}" | bun --cwd apps/api wrangler secret put LINE_CHANNEL_SECRET --env preview

      - name: Register LINE Webhook (Preview)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          bun --cwd apps/api scripts/register-webhook.ts



      - name: Skip Deployment Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN が GitHub Secrets に設定されていないためデプロイをスキップしました。"

      - name: Comment Preview Deployment on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const identifier = '<!-- preview-deploy-comment -->';

            // 1. 既存のプレビューデプロイコメントを削除 (古いコメントを削除して再投稿)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            for (const comment of comments.data) {
              if (comment.body && comment.body.includes(identifier)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // 2. 新しいプレビュー完了コメントを投稿
            const body = `${identifier}
            ### 🚀 プレビュー環境へのデプロイが完了しました！

            プルリクエストの最新コミット (\`${context.sha.substring(0, 7)}\`) のビルド・デプロイが成功しました。

            | サービス | デプロイ URL |
            | --- | --- |
            | 🖥️ **Web UI** | https://stg.kagami.kyosuke.dev |
            | ⚡ **API Server** | https://api.stg.kagami.kyosuke.dev |
            | 🤖 **MCP Server** | https://mcp.stg.kagami.kyosuke.dev |
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: body,
            });
