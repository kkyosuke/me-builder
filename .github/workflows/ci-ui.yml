name: CI / UI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-ui.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-ui.yml'
      - '.github/actions/**'

jobs:
  ui:
    name: UI Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Type Check
        run: bun --filter @me-builder/web typecheck
      - name: Build Check
        run: bun --filter @me-builder/web build
