name: CI / Lib

on:
  push:
    branches:
      - main
    paths:
      - 'packages/lib/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-lib.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/lib/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-lib.yml'
      - '.github/actions/**'

jobs:
  lib:
    name: Lib Package CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Type Check
        run: bun --filter @me-builder/lib typecheck
      - name: Run Tests
        run: bun --filter @me-builder/lib test
      - name: Build Check
        run: bun --filter @me-builder/lib build
