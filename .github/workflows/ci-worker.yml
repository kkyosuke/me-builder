name: CI / Worker

on:
  push:
    branches:
      - main
    paths:
      - 'apps/worker/**'
      - 'packages/shared/**'
      - 'packages/lib/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-worker.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/worker/**'
      - 'packages/shared/**'
      - 'packages/lib/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-worker.yml'
      - '.github/actions/**'

jobs:
  worker:
    name: Worker CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Type Check
        run: bun --filter @me-builder/worker typecheck
      - name: Run Tests
        run: bun --filter @me-builder/worker test
      - name: Build Check
        run: bun --filter @me-builder/worker build
