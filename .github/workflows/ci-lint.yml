name: CI / Lint

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'biome.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-lint.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'biome.json'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/ci-lint.yml'
      - '.github/actions/**'

jobs:
  lint:
    name: Lint & Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun-workspace
      - name: Biome Lint & Format Check
        run: bun run lint
      - name: Unused Exports Check (Knip)
        run: bun run lint:exports
      - name: Markdown Lint Check
        run: bun run lint:md
      - name: Markdown Link Check
        run: bun run lint:md:links
