name: CD / Production

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest
    environment: prd
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      # LIFF Server API は LINE Login チャネルのチャネルアクセストークンを要求する。
      # LINE_LOGIN_CHANNEL_ID は未設定でも LIFF ID の接頭辞から補完される。
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      LINE_LOGIN_CHANNEL_SECRET: ${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      VITE_BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      # Vite は GitHub Actions 上のビルドで値を埋め込むため、LIFF ID は Pages 側ではなくここで渡す。
      # 未設定の場合は LIFF 初期化がスキップされる (画面は壊れない)。
      VITE_LIFF_ID: ${{ vars.LIFF_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI Verification
        run: bun run ci

      - name: Apply D1 Migrations (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task db:migrate:production

      - name: Deploy to Cloudflare Production
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task deploy:production

      - name: Sync Secrets to Cloudflare Workers (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        run: |
          echo "${LINE_CHANNEL_ACCESS_TOKEN}" | bun --cwd apps/api wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --env production
          echo "${LINE_CHANNEL_ACCESS_TOKEN}" | bun --cwd apps/worker wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --env production

      # x-line-signature の検証を行う apps/api にのみチャネルシークレットを配布する。
      # 未設定だと環境を問わず全ての Webhook リクエストが 401 になるため、
      # 設定漏れをエラーとして扱いデプロイを失敗させる
      - name: Sync LINE Channel Secret to Cloudflare Workers (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Secrets に設定されていません。x-line-signature の検証に必須です。"
            exit 1
          fi
          echo "${LINE_CHANNEL_SECRET}" | bun --cwd apps/api wrangler secret put LINE_CHANNEL_SECRET --env production

      - name: Register LINE Webhook (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          bun --cwd apps/api scripts/register-webhook.ts

      # デプロイ済みの URL を LIFF アプリのエンドポイント URL へ反映する
      - name: Register LIFF Endpoint (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_LOGIN_CHANNEL_SECRET != '' }}
        run: |
          bun --cwd apps/web scripts/register-liff.ts production



      - name: Skip Deployment Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN が GitHub Secrets に設定されていないためデプロイをスキップしました。"
