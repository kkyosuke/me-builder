name: CD / Production

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest
    environment: prd
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI Verification
        run: bun run ci

      - name: Sync Secrets to Cloudflare Workers (Production)
        if: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        run: |
          echo "${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" | bun --cwd apps/api wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Production
        run: task deploy:production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          VITE_BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
