name: CD / Production

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    name: Deploy Production Environment
    runs-on: ubuntu-latest
    environment: prd
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      VITE_BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run CI Verification
        run: bun run ci

      - name: Deploy to Cloudflare Production
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task deploy:production

      - name: Sync Secrets to Cloudflare Workers (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        run: |
          echo "${LINE_CHANNEL_ACCESS_TOKEN}" | bun --cwd apps/api wrangler secret put LINE_CHANNEL_ACCESS_TOKEN --env production

      - name: Register LINE Webhook (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.LINE_CHANNEL_ACCESS_TOKEN != '' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
        run: |
          bun --cwd apps/api run register:webhook


      - name: Skip Deployment Notice
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN が GitHub Secrets に設定されていないためデプロイをスキップしました。"
