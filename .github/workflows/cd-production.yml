name: CD / Production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'mainの検証済みcommitをProductionへdeployする場合は deploy-production と入力'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cd-production-environment
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Production Environment
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy-production' }}
    runs-on: ubuntu-latest
    environment: prd
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # GitHub上ではデプロイ専用Secretとして管理し、CLIが要求する標準名へここだけで写す。
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      CHAT_DELIVERY_SECRET: ${{ secrets.CHAT_DELIVERY_SECRET }}
      BRAIN_VECTOR_HMAC_SECRET: ${{ secrets.BRAIN_VECTOR_HMAC_SECRET }}
      MCP_TOKEN_HMAC_SECRET: ${{ secrets.MCP_TOKEN_HMAC_SECRET }}
      MCP_FEATURE_ENABLED: ${{ vars.MCP_FEATURE_ENABLED || 'false' }}
      BILLING_PROJECTION_STALE_AFTER_SECONDS: ${{ vars.BILLING_PROJECTION_STALE_AFTER_SECONDS }}
      CLOUDFLARE_ACCESS_ALLOWED_EMAILS: ${{ vars.CLOUDFLARE_ACCESS_ALLOWED_EMAILS }}
      ADMIN_LINE_USER_IDS: ${{ secrets.ADMIN_LINE_USER_IDS }}
      # LIFF Server API は LINE Login チャネルのチャネルアクセストークンを要求する。
      # LINE_LOGIN_CHANNEL_ID は未設定でも LIFF ID の接頭辞から補完される。
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      LINE_LOGIN_CHANNEL_SECRET: ${{ secrets.LINE_LOGIN_CHANNEL_SECRET }}
      GOOGLE_IDENTITY_PLATFORM_TENANT_ID: ${{ vars.GOOGLE_IDENTITY_PLATFORM_TENANT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GCP_PLATFORM_PROJECT_ID: ${{ vars.GCP_PLATFORM_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      SSO_ROLLOUT_MODE: ${{ vars.SSO_ROLLOUT_MODE }}
      SSO_ROLLOUT_PERCENT: ${{ vars.SSO_ROLLOUT_PERCENT }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      LIFF_ID: ${{ vars.LIFF_ID }}
      VITE_ENVIRONMENT: production
      VITE_BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      # Vite は GitHub Actions 上のビルドで値を埋め込むため、LIFF ID は Pages 側ではなくここで渡す。
      # アプリ自体は未設定時も縮退できるが、Production CDでは下の必須検証で欠落を許容しない。
      VITE_LIFF_ID: ${{ vars.LIFF_ID }}
      VITE_SSO_ROLLOUT_MODE: ${{ vars.SSO_ROLLOUT_MODE }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/load-gcp-runtime-secrets
        with:
          project-id: ${{ env.GCP_PLATFORM_PROJECT_ID }}
          workload-identity-provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          environment: production

      # ProductionはMVP中核機能を提供する実環境なので、設定不足をskipや縮退成功として扱わない。
      # 値そのものは出力せず、不足しているGitHub Environmentの項目名だけを報告する。
      - name: Validate Production Configuration
        shell: bash
        run: |
          configuration_invalid=0
          required_variables=(
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCESS_ALLOWED_EMAILS
            BASE_DOMAIN
            LINE_CHANNEL_ACCESS_TOKEN
            LINE_CHANNEL_SECRET
            LINE_LOGIN_CHANNEL_SECRET
            LIFF_ID
            GCP_PLATFORM_PROJECT_ID
            GCP_WORKLOAD_IDENTITY_PROVIDER
            GOOGLE_VERTEX_AI_API_KEY
            CHAT_DELIVERY_SECRET
            BRAIN_VECTOR_HMAC_SECRET
          )
          missing_variables=()
          for variable_name in "${required_variables[@]}"; do
            variable_value="${!variable_name}"
            if [ -z "${variable_value//[[:space:]]/}" ]; then
              missing_variables+=("${variable_name}")
              echo "::error::${variable_name} が GitHub Environment prd に設定されていません。"
            fi
          done
          if [ "${#missing_variables[@]}" -gt 0 ]; then
            configuration_invalid=1
          fi

          sso_mode="${SSO_ROLLOUT_MODE:-disabled}"
          sso_percent="${SSO_ROLLOUT_PERCENT:-0}"
          case "${sso_mode}" in
            disabled|linking|linked-login) ;;
            *) echo "::error::SSO_ROLLOUT_MODE が不正です。"; configuration_invalid=1 ;;
          esac
          if ! [[ "${sso_percent}" =~ ^([0-9]|[1-9][0-9]|100)$ ]]; then
            echo "::error::SSO_ROLLOUT_PERCENT は0から100の整数で指定してください。"
            configuration_invalid=1
          fi
          if [ "${sso_mode}" != "disabled" ] && { [ -z "${GOOGLE_IDENTITY_PLATFORM_API_KEY}" ] || [ -z "${GOOGLE_IDENTITY_PLATFORM_TENANT_ID}" ] || [ -z "${GOOGLE_OAUTH_CLIENT_ID}" ] || [ -z "${GOOGLE_OAUTH_CLIENT_SECRET}" ]; }; then
            echo "::error::SSOを有効にするにはGOOGLE_IDENTITY_PLATFORM_API_KEY、GOOGLE_IDENTITY_PLATFORM_TENANT_ID、GOOGLE_OAUTH_CLIENT_ID、GOOGLE_OAUTH_CLIENT_SECRETが必要です。"
            configuration_invalid=1
          fi
          if [ "${MCP_FEATURE_ENABLED}" = "true" ] && [ -z "${MCP_TOKEN_HMAC_SECRET}" ]; then
            echo "::error::MCPを有効にするにはMCP_TOKEN_HMAC_SECRETが必要です。"
            configuration_invalid=1
          fi
          if [ -n "${BILLING_PROJECTION_STALE_AFTER_SECONDS}" ] && { ! [[ "${BILLING_PROJECTION_STALE_AFTER_SECONDS}" =~ ^[0-9]+$ ]] || [ "${BILLING_PROJECTION_STALE_AFTER_SECONDS}" -lt 60 ]; }; then
            echo "::error::BILLING_PROJECTION_STALE_AFTER_SECONDS は60以上の整数で指定してください。"
            configuration_invalid=1
          fi
          exit "${configuration_invalid}"

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 規約のversion、適用日、本文hashが不整合なら、外部resourceを変更する前に停止する。
      - name: Verify Service Terms Release Metadata
        run: task terms:verify

      # PR の CI と同じ検証を、手動で指定したmainのツリーへもう一度かける。
      - name: Run CI Verification
        run: bun run ci

      - name: Verify Vertex AI Connectivity (Production)
        run: bun run --cwd apps/worker check:gemini "Reply with OK."

      - name: Protect API Documentation with Cloudflare Access (Production)
        run: task access:setup:production

      - name: Ensure Queues (Production)
        run: task queues:setup:production

      - name: Ensure Brain Vectorize Index (Production)
        run: task vectorize:setup:production

      - name: Ensure Private Avatar R2 Bucket (Production)
        run: task avatar-bucket:setup:production

      - name: Ensure Application Session KV (Production)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: task session-store:setup:production

      - name: Apply D1 Migrations (Production)
        run: task db:migrate:production

      - name: Apply Diagnosis Seed (Production)
        run: task db:seed:production

      - name: Deploy to Cloudflare Production
        run: |
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Secrets に設定されていません。x-line-signature の検証に必須です。"
            exit 1
          fi
          if [ -z "${CHAT_DELIVERY_SECRET}" ]; then
            echo "::error::CHAT_DELIVERY_SECRET が GitHub Secrets に設定されていません。日記チャットの重複配送防止に必須です。"
            exit 1
          fi
          if [ -z "${BRAIN_VECTOR_HMAC_SECRET}" ]; then
            echo "::error::BRAIN_VECTOR_HMAC_SECRET が GitHub Secrets に設定されていません。Brain Vectorの仮名化に必須です。"
            exit 1
          fi
          sso_mode="${SSO_ROLLOUT_MODE:-disabled}"
          sso_percent="${SSO_ROLLOUT_PERCENT:-0}"

          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/worker-secrets.XXXXXX")"
          api_secrets_file="${secrets_dir}/api.json"
          worker_secrets_file="${secrets_dir}/worker.json"
          mcp_secrets_file="${secrets_dir}/mcp.json"
          trap 'rm -f "${api_secrets_file}" "${worker_secrets_file}" "${mcp_secrets_file}"; rmdir "${secrets_dir}"' EXIT

          API_SECRETS_FILE="${api_secrets_file}" WORKER_SECRETS_FILE="${worker_secrets_file}" MCP_SECRETS_FILE="${mcp_secrets_file}" bun -e '
            const sharedSecrets = [["LINE_CHANNEL_ACCESS_TOKEN", process.env.LINE_CHANNEL_ACCESS_TOKEN], ["LIFF_ID", process.env.LIFF_ID], ["ADMIN_LINE_USER_IDS", process.env.ADMIN_LINE_USER_IDS]];
            const optionalSecrets = Object.fromEntries(
              sharedSecrets
                .filter(([, value]) => value),
            );
            const apiConfiguration = Object.fromEntries(
              [["LINE_LOGIN_CHANNEL_ID", process.env.LINE_LOGIN_CHANNEL_ID], ["BILLING_PROJECTION_STALE_AFTER_SECONDS", process.env.BILLING_PROJECTION_STALE_AFTER_SECONDS]]
                .filter(([, value]) => value),
            );
            const workerOnlySecrets = Object.fromEntries(
              [["GOOGLE_VERTEX_AI_API_KEY", process.env.GOOGLE_VERTEX_AI_API_KEY], ["CHAT_DELIVERY_SECRET", process.env.CHAT_DELIVERY_SECRET], ["BRAIN_VECTOR_HMAC_SECRET", process.env.BRAIN_VECTOR_HMAC_SECRET]]
                .filter(([, value]) => value),
            );
            await Bun.write(process.env.API_SECRETS_FILE, JSON.stringify({
              LINE_CHANNEL_SECRET: process.env.LINE_CHANNEL_SECRET,
              ...(process.env.GOOGLE_IDENTITY_PLATFORM_API_KEY ? { GOOGLE_IDENTITY_PLATFORM_API_KEY: process.env.GOOGLE_IDENTITY_PLATFORM_API_KEY } : {}),
              ...(process.env.GOOGLE_OAUTH_CLIENT_SECRET ? { GOOGLE_OAUTH_CLIENT_SECRET: process.env.GOOGLE_OAUTH_CLIENT_SECRET } : {}),
              ...(process.env.MCP_TOKEN_HMAC_SECRET ? { MCP_TOKEN_HMAC_SECRET: process.env.MCP_TOKEN_HMAC_SECRET } : {}),
              ...optionalSecrets,
              ...apiConfiguration,
            }));
            await Bun.write(process.env.WORKER_SECRETS_FILE, JSON.stringify({
              ...optionalSecrets,
              ...workerOnlySecrets,
            }));
            await Bun.write(process.env.MCP_SECRETS_FILE, JSON.stringify({
              GOOGLE_VERTEX_AI_API_KEY: process.env.GOOGLE_VERTEX_AI_API_KEY,
              BRAIN_VECTOR_HMAC_SECRET: process.env.BRAIN_VECTOR_HMAC_SECRET,
              ...(process.env.MCP_TOKEN_HMAC_SECRET ? { MCP_TOKEN_HMAC_SECRET: process.env.MCP_TOKEN_HMAC_SECRET } : {}),
            }));
          '

          bun --cwd apps/worker wrangler deploy --env production --secrets-file "${worker_secrets_file}"
          api_sso_vars=(--var "SSO_ROLLOUT_MODE:${sso_mode}" --var "SSO_ROLLOUT_PERCENT:${sso_percent}" --var "MCP_FEATURE_ENABLED:${MCP_FEATURE_ENABLED}")
          if [ -n "${GOOGLE_IDENTITY_PLATFORM_TENANT_ID}" ]; then api_sso_vars+=(--var "GOOGLE_IDENTITY_PLATFORM_TENANT_ID:${GOOGLE_IDENTITY_PLATFORM_TENANT_ID}"); fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID}" ]; then api_sso_vars+=(--var "GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID}"); fi
          bun --cwd apps/api wrangler deploy --env production --secrets-file "${api_secrets_file}" "${api_sso_vars[@]}"
          bun --cwd apps/mcp wrangler deploy --env production --secrets-file "${mcp_secrets_file}" --var "MCP_FEATURE_ENABLED:${MCP_FEATURE_ENABLED}"
          bun --filter @me-builder/web deploy:production

      - name: Verify Service Site Metadata and Search Boundaries (Production)
        run: task service-site:verify:deployed

      - name: Verify API Documentation Access (Production)
        run: task access:verify:production

      # URL が変わっていなければ現在の登録状態を 1 回問い合わせるだけで終わる。
      - name: Register LINE Webhook (Production)
        run: |
          bun --cwd apps/api scripts/register-webhook.ts

      # デプロイ済みの URL を LIFF アプリのエンドポイント URL へ反映する
      - name: Register LIFF Endpoint (Production)
        run: |
          bun --cwd apps/web scripts/register-liff.ts production

      - name: Verify Application Session Boundary (Production)
        run: task auth:verify:deployed-production

      - name: Register LINE Rich Menu (Production)
        run: bun run --cwd apps/api register:rich-menu:production
