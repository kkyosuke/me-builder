name: CI / API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-api.yml'
      - '.github/actions/**'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/ci-api.yml'
      - '.github/actions/**'

jobs:
  api:
    name: API Server CI
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-bun-workspace
      - name: Type Check
        run: bun --filter @me-builder/api typecheck
      - name: Run Tests
        run: bun --filter @me-builder/api test
      - name: Build Check
        run: bun --filter @me-builder/api build
