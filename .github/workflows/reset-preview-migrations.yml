name: Reset / Preview Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '全 Preview データを削除するには "reset-preview:<選択branch>" と入力'
        required: true
        type: string
      reason:
        description: '実行理由（200文字以内。監査記録へ保存）'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: write

# Preview のデプロイと同時に変更しない。実行中の reset/deploy は中断させない。
concurrency:
  group: cd-preview
  cancel-in-progress: false

jobs:
  validate-reset-request:
    name: Validate Preview Reset Request
    runs-on: ubuntu-latest
    env:
      CONFIRMATION: ${{ inputs.confirmation }}
      REASON: ${{ inputs.reason }}
      RESET_REF: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - name: Validate Branch, Confirmation, and Reason
        run: |
          expected_confirmation="reset-preview:${RESET_REF}"
          if [ "${CONFIRMATION}" != "${expected_confirmation}" ]; then
            echo "::error::確認文字列が一致しません。reset-preview:<選択branch> を入力してください。"
            exit 1
          fi
          reason_without_space="${REASON//[[:space:]]/}"
          if [ -z "${reason_without_space}" ] || [ "${#REASON}" -gt 200 ]; then
            echo "::error::実行理由は空白以外を含む200文字以内で入力してください。"
            exit 1
          fi
          if [ "${REF_TYPE}" != "branch" ]; then
            echo "::error::ブランチを選んで実行してください。tagからは reset できません。"
            exit 1
          fi

  approve-preview-reset:
    name: Approve Preview Infrastructure Reset
    needs: validate-reset-request
    runs-on: ubuntu-latest
    environment: infra
    steps:
      - name: Record Approval
        run: echo "Preview infrastructure reset was approved."

  reset-preview:
    name: Reset Preview D1 and Durable Objects
    needs: approve-preview-reset
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      GOOGLE_VERTEX_AI_API_KEY: ${{ secrets.GOOGLE_VERTEX_AI_API_KEY }}
      CHAT_DELIVERY_SECRET: ${{ secrets.CHAT_DELIVERY_SECRET }}
      BRAIN_VECTOR_HMAC_SECRET: ${{ secrets.BRAIN_VECTOR_HMAC_SECRET }}
      ADMIN_LINE_USER_IDS: ${{ secrets.ADMIN_LINE_USER_IDS }}
      LIFF_ID: ${{ vars.LIFF_ID }}
      LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
      GOOGLE_IDENTITY_PLATFORM_API_KEY: ${{ secrets.GOOGLE_IDENTITY_PLATFORM_API_KEY }}
      GOOGLE_IDENTITY_PLATFORM_TENANT_ID: ${{ vars.GOOGLE_IDENTITY_PLATFORM_TENANT_ID }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      SSO_ROLLOUT_MODE: ${{ vars.SSO_ROLLOUT_MODE }}
      SSO_ROLLOUT_PERCENT: ${{ vars.SSO_ROLLOUT_PERCENT }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
      GCP_STATE_PROJECT_ID: ${{ vars.GCP_STATE_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

    steps:
      # 選択branchと確認文字列を一致させ、resource IDは後段で専用PRへ反映する。
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 削除後に復元不能にならないよう、破壊的操作より前に必要値をすべて検証する。
      - name: Validate Restore Configuration
        run: |
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_API_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${LINE_CHANNEL_ACCESS_TOKEN}" ]; then
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${GOOGLE_VERTEX_AI_API_KEY}" ]; then
            echo "::error::GOOGLE_VERTEX_AI_API_KEY が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CHAT_DELIVERY_SECRET}" ]; then
            echo "::error::CHAT_DELIVERY_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${BRAIN_VECTOR_HMAC_SECRET}" ]; then
            echo "::error::BRAIN_VECTOR_HMAC_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${PULUMI_CONFIG_PASSPHRASE//[[:space:]]/}" ]; then
            echo "::error::PULUMI_CONFIG_PASSPHRASE がGitHub Environment devに設定されていません。"
            exit 1
          fi
          required_gcp_variables=(
            GCP_STATE_PROJECT_ID
            GCP_WORKLOAD_IDENTITY_PROVIDER
          )
          for variable_name in "${required_gcp_variables[@]}"; do
            variable_value="${!variable_name}"
            if [ -z "${variable_value//[[:space:]]/}" ]; then
              echo "::error::${variable_name} がGitHub Environment devに設定されていません。"
              exit 1
            fi
          done
          sso_mode="${SSO_ROLLOUT_MODE:-disabled}"
          sso_percent="${SSO_ROLLOUT_PERCENT:-0}"
          case "${sso_mode}" in
            disabled|linking|linked-login) ;;
            *) echo "::error::SSO_ROLLOUT_MODE が不正です。"; exit 1 ;;
          esac
          if ! [[ "${sso_percent}" =~ ^([0-9]|[1-9][0-9]|100)$ ]]; then
            echo "::error::SSO_ROLLOUT_PERCENT は0から100の整数で指定してください。"
            exit 1
          fi
          if [ "${sso_mode}" != "disabled" ] && { [ -z "${GOOGLE_IDENTITY_PLATFORM_API_KEY}" ] || [ -z "${GOOGLE_IDENTITY_PLATFORM_TENANT_ID}" ] || [ -z "${GOOGLE_OAUTH_CLIENT_ID}" ] || [ -z "${GOOGLE_OAUTH_CLIENT_SECRET}" ]; }; then
            echo "::error::SSOを有効にするにはGOOGLE_IDENTITY_PLATFORM_API_KEY、GOOGLE_IDENTITY_PLATFORM_TENANT_ID、GOOGLE_OAUTH_CLIENT_ID、GOOGLE_OAUTH_CLIENT_SECRETが必要です。"
            exit 1
          fi
          bun --cwd apps/web scripts/validate-liff-configuration.ts

      # 後続の破壊操作が失敗しても、対象・実行者・理由・run URLを先に証跡へ残す。
      - name: Record Authorized Reset
        env:
          RESET_ACTOR: ${{ github.actor }}
          RESET_REASON: ${{ inputs.reason }}
          RESET_REF: ${{ github.ref_name }}
        run: |
          reason_one_line="$(printf '%s' "${RESET_REASON}" | tr '\r\n' '  ')"
          {
            echo "### Authorized Preview reset"
            echo
            echo "- Actor: \`${RESET_ACTOR}\`"
            echo "- Target branch: \`${RESET_REF}\`"
            echo "- Target environment: \`dev / Preview\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Reason:"
            echo
            echo "    ${reason_one_line}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Authenticate to Pulumi State on Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_STATE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Install Pulumi CLI
        run: |
          installer="${RUNNER_TEMP}/install-pulumi.sh"
          curl --fail --silent --show-error --location --output "${installer}" https://get.pulumi.com
          bash "${installer}" --version 3.256.0
          echo "${HOME}/.pulumi/bin" >> "${GITHUB_PATH}"

      - name: Recreate Preview Foundation with Pulumi
        env:
          ALLOW_PREVIEW_DESTROY: preview
        run: |
          task infra:preview:clean
          task infra:preview:up

      - name: Apply Current Branch D1 Migrations and Seed
        run: |
          task db:migrate:preview
          task db:seed:preview

      - name: Ensure Brain Vectorize Index
        run: task vectorize:setup:preview

      - name: Redeploy Preview Worker, API, and MCP
        run: |
          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/reset-secrets.XXXXXX")"
          api_secrets_file="${secrets_dir}/api.json"
          worker_secrets_file="${secrets_dir}/worker.json"
          trap 'rm -f "${api_secrets_file}" "${worker_secrets_file}"; rmdir "${secrets_dir}"' EXIT

          API_SECRETS_FILE="${api_secrets_file}" WORKER_SECRETS_FILE="${worker_secrets_file}" bun -e '
            const sharedSecrets = [["LINE_CHANNEL_ACCESS_TOKEN", process.env.LINE_CHANNEL_ACCESS_TOKEN], ["LIFF_ID", process.env.LIFF_ID], ["ADMIN_LINE_USER_IDS", process.env.ADMIN_LINE_USER_IDS]];
            const optionalSecrets = Object.fromEntries(sharedSecrets.filter(([, value]) => value));
            const apiConfiguration = Object.fromEntries(
              [["LINE_LOGIN_CHANNEL_ID", process.env.LINE_LOGIN_CHANNEL_ID]].filter(([, value]) => value),
            );
            const workerOnlySecrets = Object.fromEntries(
              [["GOOGLE_VERTEX_AI_API_KEY", process.env.GOOGLE_VERTEX_AI_API_KEY], ["CHAT_DELIVERY_SECRET", process.env.CHAT_DELIVERY_SECRET], ["BRAIN_VECTOR_HMAC_SECRET", process.env.BRAIN_VECTOR_HMAC_SECRET]].filter(([, value]) => value),
            );
            await Bun.write(process.env.API_SECRETS_FILE, JSON.stringify({
              LINE_CHANNEL_SECRET: process.env.LINE_CHANNEL_SECRET,
              ...(process.env.GOOGLE_IDENTITY_PLATFORM_API_KEY ? { GOOGLE_IDENTITY_PLATFORM_API_KEY: process.env.GOOGLE_IDENTITY_PLATFORM_API_KEY } : {}),
              ...(process.env.GOOGLE_OAUTH_CLIENT_SECRET ? { GOOGLE_OAUTH_CLIENT_SECRET: process.env.GOOGLE_OAUTH_CLIENT_SECRET } : {}),
              ...optionalSecrets,
              ...apiConfiguration,
            }));
            await Bun.write(process.env.WORKER_SECRETS_FILE, JSON.stringify({
              ...optionalSecrets,
              ...workerOnlySecrets,
            }));
          '

          bun --cwd apps/worker wrangler deploy --env preview --secrets-file "${worker_secrets_file}"
          sso_mode="${SSO_ROLLOUT_MODE:-disabled}"
          sso_percent="${SSO_ROLLOUT_PERCENT:-0}"
          api_sso_vars=(--var "SSO_ROLLOUT_MODE:${sso_mode}" --var "SSO_ROLLOUT_PERCENT:${sso_percent}")
          if [ -n "${GOOGLE_IDENTITY_PLATFORM_TENANT_ID}" ]; then api_sso_vars+=(--var "GOOGLE_IDENTITY_PLATFORM_TENANT_ID:${GOOGLE_IDENTITY_PLATFORM_TENANT_ID}"); fi
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID}" ]; then api_sso_vars+=(--var "GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID}"); fi
          bun --cwd apps/api wrangler deploy --env preview --secrets-file "${api_secrets_file}" "${api_sso_vars[@]}"
          bun --filter @me-builder/mcp deploy:preview

      - name: Verify Restored Preview Connections
        run: bun run --cwd apps/worker check:gemini "Reply with OK."

      # 破壊的な再作成の後段なので、ここで失敗すると新しいresource IDがリポジトリへ残らない。
      # lefthookのhook (branch-name / typecheck / test) はローカル開発者向けの検証で、
      # main経路では後続stepが同じ検証を回すため、この自動commit/pushでは無効化する。
      - name: Commit Recreated Resource IDs
        id: resource-ids
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEFTHOOK: "0"
        run: |
          git add \
            infra/environments/preview.json \
            apps/api/wrangler.toml \
            apps/mcp/wrangler.toml \
            apps/worker/wrangler.toml \
            packages/lib/wrangler.toml
          if git diff --cached --quiet; then
            echo "mode=none" >> "${GITHUB_OUTPUT}"
            echo "Cloudflare resource IDs did not change; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # commitlint (config-conventional) のsubject-caseに従い、subjectは小文字で始める。
          message="chore(infra): preview resource IDを更新"

          # mainはrulesetで直接pushできないため、専用branchのPRを作って検証後にマージする。
          # ブランチ名はリポジトリの命名規約 (feature|bugfix|hotfix|chore|docs|refactor|test|usagi) に合わせる。
          branch="chore/preview-resource-ids-${GITHUB_RUN_ID}"
          git switch -c "${branch}"
          git commit -m "${message}"
          git push origin "${branch}"
          body="$(printf '%s\n\n%s\n' \
            "Preview環境の再構築で変更されたD1、Private R2、Queueの情報を、Pulumi stack outputから生成したmanifestとWrangler TOMLへ反映します。" \
            "Generated by workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          gh pr create \
            --base main \
            --head "${branch}" \
            --title "${message}" \
            --body "${body}"
          echo "mode=pr" >> "${GITHUB_OUTPUT}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      # GITHUB_TOKENで作成したPRはpull_requestイベントを発火せず、ci.ymlが走らない。
      # マージ前の検証が空になるのを避けるため、同じjobで`bun run ci`を実行する。
      - name: Validate Resource ID Pull Request
        if: steps.resource-ids.outputs.mode == 'pr'
        run: bun run ci

      # 検証が通ったときだけマージする。失敗時はPRを開いたまま残し、人が判断する。
      # merge methodはmainのrulesetがsquashだけを許可している。branchの削除はリポジトリ設定
      # (delete_branch_on_merge) が行うため、`--delete-branch` は付けない。
      - name: Merge Resource ID Pull Request
        if: steps.resource-ids.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BRANCH: ${{ steps.resource-ids.outputs.branch }}
        run: gh pr merge "${PR_BRANCH}" --squash

      - name: Publish Reset Summary
        env:
          RESET_REF: ${{ github.ref_name }}
          RESET_SHA: ${{ github.sha }}
          RESOURCE_ID_MODE: ${{ steps.resource-ids.outputs.mode }}
        run: |
          {
            echo "### Preview migration reset completed"
            echo
            echo "ブランチ \`${RESET_REF}\` のコミット \`${RESET_SHA:0:7}\` を使って、Preview の D1 migration と全 Durable Object storage をリセットしました。"
            echo
            echo "- PreviewのD1、Private R2、Queue/DLQ、Worker/DOを削除し、Pulumiで基盤を再作成しました。"
            echo "- mainのD1 migrationと診断seedを適用しました。"
            echo "- Workerで構成された全 Durable Object namespaceを再作成しました。"
            echo "- Preview Worker、API、MCPを再デプロイし、外部接続を検証しました。"
            case "${RESOURCE_ID_MODE}" in
              pr)
                echo "- 変更されたresource IDの反映PRを作成し、\`bun run ci\`が通ったのでsquash mergeしました。"
                ;;
              *)
                echo "- resource IDに変更がなかったため、commitしていません。"
                ;;
            esac
          } >> "${GITHUB_STEP_SUMMARY}"
