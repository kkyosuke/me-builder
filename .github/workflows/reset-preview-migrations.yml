name: Reset / Preview Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '全 Preview データを削除するには "reset-preview" と入力'
        required: true
        type: string

permissions:
  contents: read

# Preview のデプロイと同時に変更しない。実行中の reset/deploy は中断させない。
concurrency:
  group: cd-preview
  cancel-in-progress: false

jobs:
  reset-preview:
    name: Reset Preview D1 and Durable Objects
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      CLOUDFLARE_APP_API_TOKEN: ${{ secrets.CLOUDFLARE_APP_API_TOKEN }}
      CHAT_DELIVERY_SECRET: ${{ secrets.CHAT_DELIVERY_SECRET }}
      CLOUDFLARE_AI_GATEWAY_ID: ${{ vars.CLOUDFLARE_AI_GATEWAY_ID }}
      ADMIN_LINE_USER_IDS: ${{ secrets.ADMIN_LINE_USER_IDS }}
      LIFF_ID: ${{ vars.LIFF_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 削除後に復元不能にならないよう、破壊的操作より前に必要値をすべて検証する。
      - name: Validate Reset Request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "${CONFIRMATION}" != "reset-preview" ]; then
            echo '::error::確認文字列が一致しません。"reset-preview" と入力してください。'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_API_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${LINE_CHANNEL_ACCESS_TOKEN}" ]; then
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${GOOGLE_AI_STUDIO_API_KEY}" ]; then
            echo "::error::GOOGLE_AI_STUDIO_API_KEY が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_APP_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_APP_API_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CHAT_DELIVERY_SECRET}" ]; then
            echo "::error::CHAT_DELIVERY_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi

      # API Worker は Worker 所有の DO namespace を外部 binding しているため先に削除する。
      # GET の 404 は再実行時の正常系として扱い、それ以外の API エラーは削除前に停止する。
      - name: Delete Preview API Worker
        run: |
          response_file="${RUNNER_TEMP}/api-worker-response.json"
          status="$({ curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/me-builder-api-preview"; } || true)"
          case "${status}" in
            200)
              bun --cwd apps/api wrangler delete --env preview
              ;;
            404)
              echo "Preview API Worker is already absent."
              ;;
            *)
              echo "::error::Preview API Worker の確認に失敗しました (HTTP ${status})。"
              jq -r '.errors[]?.message // empty' "${response_file}"
              exit 1
              ;;
          esac

      # Worker の削除により、所有する全 SQLite-backed DO namespace と migration 履歴を破棄する。
      - name: Delete Preview Worker and Durable Objects
        run: |
          response_file="${RUNNER_TEMP}/worker-response.json"
          status="$({ curl --silent --show-error --output "${response_file}" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/me-builder-worker-preview"; } || true)"
          case "${status}" in
            200)
              bun --cwd apps/worker wrangler delete --env preview
              ;;
            404)
              echo "Preview Worker is already absent."
              ;;
            *)
              echo "::error::Preview Worker の確認に失敗しました (HTTP ${status})。"
              jq -r '.errors[]?.message // empty' "${response_file}"
              exit 1
              ;;
          esac

      # Database resourceとIDは維持し、Cloudflare予約table以外を削除する。
      # d1_migrationsも削除対象になるため、次のstepで現在branchの全migrationが再適用される。
      - name: Drop Preview D1 Tables and Migration History
        run: bun scripts/reset-preview-d1.ts

      - name: Apply Current Branch D1 Migrations and Seed
        run: |
          task db:migrate:preview
          task db:seed:preview

      - name: Ensure Preview Queues
        run: task queues:setup:preview

      - name: Redeploy Preview Worker, API, and MCP
        run: |
          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/reset-secrets.XXXXXX")"
          api_secrets_file="${secrets_dir}/api.json"
          worker_secrets_file="${secrets_dir}/worker.json"
          trap 'rm -f "${api_secrets_file}" "${worker_secrets_file}"; rmdir "${secrets_dir}"' EXIT

          API_SECRETS_FILE="${api_secrets_file}" WORKER_SECRETS_FILE="${worker_secrets_file}" bun -e '
            const sharedSecrets = [["LINE_CHANNEL_ACCESS_TOKEN", process.env.LINE_CHANNEL_ACCESS_TOKEN], ["LIFF_ID", process.env.LIFF_ID], ["ADMIN_LINE_USER_IDS", process.env.ADMIN_LINE_USER_IDS], ["CLOUDFLARE_APP_API_TOKEN", process.env.CLOUDFLARE_APP_API_TOKEN]];
            const optionalSecrets = Object.fromEntries(sharedSecrets.filter(([, value]) => value));
            const workerOnlySecrets = Object.fromEntries(
              [["GOOGLE_AI_STUDIO_API_KEY", process.env.GOOGLE_AI_STUDIO_API_KEY], ["CHAT_DELIVERY_SECRET", process.env.CHAT_DELIVERY_SECRET]].filter(([, value]) => value),
            );
            await Bun.write(process.env.API_SECRETS_FILE, JSON.stringify({
              LINE_CHANNEL_SECRET: process.env.LINE_CHANNEL_SECRET,
              CLOUDFLARE_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
              CLOUDFLARE_AI_GATEWAY_ID: process.env.CLOUDFLARE_AI_GATEWAY_ID || "default",
              ...optionalSecrets,
            }));
            await Bun.write(process.env.WORKER_SECRETS_FILE, JSON.stringify({
              ...optionalSecrets,
              ...workerOnlySecrets,
            }));
          '

          bun --cwd apps/worker wrangler deploy --env preview --secrets-file "${worker_secrets_file}"
          bun --cwd apps/api wrangler deploy --env preview --secrets-file "${api_secrets_file}"
          bun --filter @me-builder/mcp deploy:preview

      - name: Verify Restored Preview Connections
        run: |
          bun --cwd apps/worker run check:gemini "Reply with OK."
          bun --cwd apps/api run check:analytics

      - name: Publish Reset Summary
        env:
          RESET_REF: ${{ github.ref_name }}
          RESET_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Preview migration reset completed"
            echo
            echo "ブランチ \`${RESET_REF}\` のコミット \`${RESET_SHA:0:7}\` を使って、Preview の D1 migration と全 Durable Object storage をリセットしました。"
            echo
            echo "- D1 database resourceとIDを維持したまま、全ユーザーテーブルとmigration履歴を削除しました。"
            echo "- 現在のブランチのD1 migrationと診断seedを適用しました。"
            echo "- Workerで構成された全 Durable Object namespaceを再作成しました。"
            echo "- Preview Worker、API、MCPを再デプロイし、外部接続を検証しました。"
          } >> "${GITHUB_STEP_SUMMARY}"
