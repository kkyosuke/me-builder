name: Reset / Preview Migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: '全 Preview データを削除するには "reset-preview" と入力'
        required: true
        type: string

permissions:
  contents: read

# Preview のデプロイと同時に変更しない。実行中の reset/deploy は中断させない。
concurrency:
  group: cd-preview
  cancel-in-progress: false

jobs:
  reset-preview:
    name: Reset Preview D1 and Durable Objects
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
      GOOGLE_VERTEX_AI_API_KEY: ${{ secrets.GOOGLE_VERTEX_AI_API_KEY }}
      CHAT_DELIVERY_SECRET: ${{ secrets.CHAT_DELIVERY_SECRET }}
      ADMIN_LINE_USER_IDS: ${{ secrets.ADMIN_LINE_USER_IDS }}
      LIFF_ID: ${{ vars.LIFF_ID }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun-workspace

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # 削除後に復元不能にならないよう、破壊的操作より前に必要値をすべて検証する。
      - name: Validate Reset Request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "${CONFIRMATION}" != "reset-preview" ]; then
            echo '::error::確認文字列が一致しません。"reset-preview" と入力してください。'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_API_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${LINE_CHANNEL_SECRET}" ]; then
            echo "::error::LINE_CHANNEL_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${LINE_CHANNEL_ACCESS_TOKEN}" ]; then
            echo "::error::LINE_CHANNEL_ACCESS_TOKEN が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${GOOGLE_VERTEX_AI_API_KEY}" ]; then
            echo "::error::GOOGLE_VERTEX_AI_API_KEY が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${CHAT_DELIVERY_SECRET}" ]; then
            echo "::error::CHAT_DELIVERY_SECRET が GitHub Environment dev に設定されていません。"
            exit 1
          fi
          if [ -z "${BASE_DOMAIN}" ]; then
            echo "::error::BASE_DOMAIN が GitHub Environment dev に設定されていません。"
            exit 1
          fi

      # reset中のQueue処理によるDOへの書き戻しを止める。最後のalways stepで必ず再開する。
      - name: Pause Preview Queue Delivery
        id: pause_queues
        run: |
          echo "resume_required=true" >> "${GITHUB_OUTPUT}"
          status=0
          for queue in \
            me-builder-webhook-queue-preview \
            me-builder-chat-turn-queue-preview \
            me-builder-brain-checkpoint-queue-preview
          do
            bun --cwd apps/worker wrangler queues pause-delivery "${queue}" || status=$?
          done
          exit "${status}"

      # workflow実行中だけ有効なtokenをWorker/APIへ配布し、全DO instanceのdeleteAll RPCを公開する。
      - name: Deploy Preview Durable Object Reset Bridge
        id: reset_bridge
        run: |
          reset_token="$(openssl rand -hex 32)"
          echo "::add-mask::${reset_token}"
          echo "PREVIEW_RESET_TOKEN=${reset_token}" >> "${GITHUB_ENV}"
          echo "cleanup_required=true" >> "${GITHUB_OUTPUT}"

          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/reset-bridge-secrets.XXXXXX")"
          api_secrets_file="${secrets_dir}/api.json"
          worker_secrets_file="${secrets_dir}/worker.json"
          trap 'rm -f "${api_secrets_file}" "${worker_secrets_file}"; rmdir "${secrets_dir}"' EXIT

          PREVIEW_RESET_TOKEN="${reset_token}" API_SECRETS_FILE="${api_secrets_file}" WORKER_SECRETS_FILE="${worker_secrets_file}" bun -e '
            const sharedSecrets = [["LINE_CHANNEL_ACCESS_TOKEN", process.env.LINE_CHANNEL_ACCESS_TOKEN], ["LIFF_ID", process.env.LIFF_ID], ["ADMIN_LINE_USER_IDS", process.env.ADMIN_LINE_USER_IDS]];
            const optionalSecrets = Object.fromEntries(sharedSecrets.filter(([, value]) => value));
            await Bun.write(process.env.API_SECRETS_FILE, JSON.stringify({
              LINE_CHANNEL_SECRET: process.env.LINE_CHANNEL_SECRET,
              PREVIEW_RESET_TOKEN: process.env.PREVIEW_RESET_TOKEN,
              ...optionalSecrets,
            }));
            await Bun.write(process.env.WORKER_SECRETS_FILE, JSON.stringify({
              ...optionalSecrets,
              GOOGLE_VERTEX_AI_API_KEY: process.env.GOOGLE_VERTEX_AI_API_KEY,
              CHAT_DELIVERY_SECRET: process.env.CHAT_DELIVERY_SECRET,
              PREVIEW_RESET_TOKEN: process.env.PREVIEW_RESET_TOKEN,
            }));
          '

          bun --cwd apps/worker wrangler deploy --env preview --secrets-file "${worker_secrets_file}"
          bun --cwd apps/api wrangler deploy --env preview --secrets-file "${api_secrets_file}"

      # namespace IDを維持し、Cloudflare APIで列挙した全DO instanceのstorageとalarmを削除する。
      - name: Reset Preview Durable Object Storage
        run: bun scripts/reset-preview-durable-objects.ts

      # Database resourceとIDは維持し、Cloudflare予約table以外を削除する。
      # d1_migrationsも削除対象になるため、次のstepで現在branchの全migrationが再適用される。
      - name: Drop Preview D1 Tables and Migration History
        run: bun scripts/reset-preview-d1.ts

      - name: Apply Current Branch D1 Migrations and Seed
        run: |
          task db:migrate:preview
          task db:seed:preview

      - name: Ensure Preview Queues
        run: task queues:setup:preview

      - name: Redeploy Preview Worker, API, and MCP
        if: ${{ always() && steps.reset_bridge.outputs.cleanup_required == 'true' }}
        run: |
          umask 077
          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/reset-secrets.XXXXXX")"
          api_secrets_file="${secrets_dir}/api.json"
          worker_secrets_file="${secrets_dir}/worker.json"
          trap 'rm -f "${api_secrets_file}" "${worker_secrets_file}"; rmdir "${secrets_dir}"' EXIT

          API_SECRETS_FILE="${api_secrets_file}" WORKER_SECRETS_FILE="${worker_secrets_file}" bun -e '
            const sharedSecrets = [["LINE_CHANNEL_ACCESS_TOKEN", process.env.LINE_CHANNEL_ACCESS_TOKEN], ["LIFF_ID", process.env.LIFF_ID], ["ADMIN_LINE_USER_IDS", process.env.ADMIN_LINE_USER_IDS]];
            const optionalSecrets = Object.fromEntries(sharedSecrets.filter(([, value]) => value));
            const workerOnlySecrets = Object.fromEntries(
              [["GOOGLE_VERTEX_AI_API_KEY", process.env.GOOGLE_VERTEX_AI_API_KEY], ["CHAT_DELIVERY_SECRET", process.env.CHAT_DELIVERY_SECRET]].filter(([, value]) => value),
            );
            await Bun.write(process.env.API_SECRETS_FILE, JSON.stringify({
              LINE_CHANNEL_SECRET: process.env.LINE_CHANNEL_SECRET,
              ...optionalSecrets,
            }));
            await Bun.write(process.env.WORKER_SECRETS_FILE, JSON.stringify({
              ...optionalSecrets,
              ...workerOnlySecrets,
            }));
          '

          bun --cwd apps/worker wrangler deploy --env preview --secrets-file "${worker_secrets_file}"
          bun --cwd apps/api wrangler deploy --env preview --secrets-file "${api_secrets_file}"
          bun --filter @me-builder/mcp deploy:preview

      - name: Resume Preview Queue Delivery
        if: ${{ always() && steps.pause_queues.outputs.resume_required == 'true' }}
        run: |
          status=0
          for queue in \
            me-builder-webhook-queue-preview \
            me-builder-chat-turn-queue-preview \
            me-builder-brain-checkpoint-queue-preview
          do
            bun --cwd apps/worker wrangler queues resume-delivery "${queue}" || status=$?
          done
          exit "${status}"

      - name: Verify Restored Preview Connections
        run: bun run --cwd apps/worker check:gemini "Reply with OK."

      - name: Publish Reset Summary
        env:
          RESET_REF: ${{ github.ref_name }}
          RESET_SHA: ${{ github.sha }}
        run: |
          {
            echo "### Preview migration reset completed"
            echo
            echo "ブランチ \`${RESET_REF}\` のコミット \`${RESET_SHA:0:7}\` を使って、Preview の D1 migration と全 Durable Object storage をリセットしました。"
            echo
            echo "- D1 database resourceとIDを維持したまま、全ユーザーテーブルとmigration履歴を削除しました。"
            echo "- 現在のブランチのD1 migrationと診断seedを適用しました。"
            echo "- Durable Object namespace IDを維持したまま、全instanceのstorageとmigration履歴を削除しました。"
            echo "- Preview Worker、API、MCPを再デプロイし、外部接続を検証しました。"
          } >> "${GITHUB_STEP_SUMMARY}"
