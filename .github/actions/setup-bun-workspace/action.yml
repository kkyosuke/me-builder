name: 'Setup Bun Workspace'
description: 'Setup Bun, restore dependency and TypeScript caches, and run bun install'

runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'

    # `**/bun.lock` はツリー全体 (node_modules を含む) を走査するため、
    # ルートの lockfile だけをキーにする。lockfile が同じなら常に同じキーになる。
    - name: Cache Bun dependencies
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    # tsc の incremental 情報。前回の型チェック結果を再利用し、変更が無いパッケージの
    # 再チェックを省く。取得だけを行い、保存は main の CD だけが担う
    # (PR ごとに保存すると repository cache の 10GB 上限を圧迫し、依存キャッシュが追い出される)。
    - name: Restore TypeScript build info
      uses: actions/cache/restore@v4
      with:
        # `**/*.tsbuildinfo` は node_modules まで走査するため、生成先を直接指定する。
        path: |
          apps/*/tsconfig.tsbuildinfo
          packages/*/tsconfig.tsbuildinfo
          infra/tsconfig.tsbuildinfo
        key: ${{ runner.os }}-tsbuildinfo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-tsbuildinfo-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
