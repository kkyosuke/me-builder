version: '3'

tasks:
  install:
    aliases: [i]
    desc: 'Install all dependencies using Bun'
    cmds:
      - bun install

  dev:
    desc: 'Start all development servers (UI, API, MCP, Worker)'
    deps:
      - dev:ui
      - dev:api
      - dev:mcp
      - dev:worker

  dev:ui:
    desc: 'Start UI development server (React / Vite)'
    cmds:
      - bun --filter @me-builder/web dev

  dev:api:
    desc: 'Start API development server (Bun.serve / Hono)'
    cmds:
      - bun --filter @me-builder/api dev

  dev:mcp:
    desc: 'Start MCP development server'
    cmds:
      - bun --filter @me-builder/mcp dev

  dev:worker:
    desc: 'Start Worker development server'
    cmds:
      - bun --filter @me-builder/worker dev


  build:
    desc: 'Build all applications and packages'
    cmds:
      - bun --filter '*' build

  typecheck:
    desc: 'Run TypeScript typecheck on all applications and packages'
    cmds:
      - bun run typecheck

  lint:
    desc: 'Run Biome check on the codebase'
    cmds:
      - bun run lint

  lint:fix:
    desc: 'Fix Biome lint and format issues'
    cmds:
      - bun run lint:fix

  test:
    desc: 'Run tests using Vitest'
    cmds:
      - bun run test

  ci:
    desc: 'Run full CI checks locally (generated files, lint, typecheck, test, build)'
    cmds:
      - bun run ci

  generate:api:
    desc: 'Generate OpenAPI document and Web API types'
    cmds:
      - bun run generate:api

  db:setup:
    desc: 'Automatically create missing remote D1 databases and update wrangler.toml files'
    cmds:
      - bun scripts/setup-d1.ts

  queues:setup:preview:
    desc: 'Create diary chat Queues and DLQs for preview if missing'
    cmds:
      - bun scripts/setup-chat-queues.ts preview

  queues:setup:production:
    desc: 'Create diary chat Queues and DLQs for production if missing'
    cmds:
      - bun scripts/setup-chat-queues.ts production

  vectorize:setup:preview:
    desc: 'Create the preview Brain Vectorize index and metadata index if missing'
    cmds:
      - bun scripts/setup-brain-vectorize.ts preview

  vectorize:setup:production:
    desc: 'Create the production Brain Vectorize index and metadata index if missing'
    cmds:
      - bun scripts/setup-brain-vectorize.ts production

  access:setup:preview:
    desc: 'Protect preview OpenAPI and Swagger UI routes with Cloudflare Access'
    cmds:
      - bun scripts/setup-api-docs-access.ts preview

  access:setup:production:
    desc: 'Protect production OpenAPI and Swagger UI routes with Cloudflare Access'
    cmds:
      - bun scripts/setup-api-docs-access.ts production

  line:rich-menu:preview:
    desc: 'Register the preview LINE rich menu as the default'
    cmds:
      - bun run --cwd apps/api register:rich-menu:preview

  line:rich-menu:production:
    desc: 'Register the production LINE rich menu as the default'
    cmds:
      - bun run --cwd apps/api register:rich-menu:production

  db:migrate:local:
    aliases: [db:migrate]
    desc: 'Apply D1 database migrations locally'
    cmds:
      - bun --filter @me-builder/lib db:migrate:local

  db:migrate:preview:
    desc: 'Apply D1 database migrations to preview environment'
    cmds:
      - bun --filter @me-builder/lib db:migrate:preview

  db:migrate:production:
    desc: 'Apply D1 database migrations to production environment'
    cmds:
      - bun --filter @me-builder/lib db:migrate:production

  db:seed:local:
    desc: 'Seed diagnoses into the local D1 database'
    cmds:
      - bun --filter @me-builder/lib db:seed:local

  db:seed:preview:
    desc: 'Seed diagnoses into the preview D1 database'
    cmds:
      - bun --filter @me-builder/lib db:seed:preview

  db:seed:production:
    desc: 'Seed diagnoses into the production D1 database'
    cmds:
      - bun --filter @me-builder/lib db:seed:production

  deploy:preview:
    desc: 'Deploy all applications to preview environment via Wrangler'
    cmds:
      - task: access:setup:preview
      - bun --filter @me-builder/worker deploy:preview
      - bun --filter @me-builder/api deploy:preview
      - bun --filter @me-builder/mcp deploy:preview
      - bun --filter @me-builder/web deploy:preview

  deploy:production:
    desc: 'Deploy all applications to production environment via Wrangler'
    cmds:
      - task: access:setup:production
      - bun --filter @me-builder/worker deploy:production
      - bun --filter @me-builder/api deploy:production
      - bun --filter @me-builder/mcp deploy:production
      - bun --filter @me-builder/web deploy:production
