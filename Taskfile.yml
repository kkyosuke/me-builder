version: '3'

tasks:
  install:
    aliases: [i]
    desc: 'Install all dependencies using Bun'
    cmds:
      - bun install

  dev:
    desc: 'Start all development servers (UI, API, MCP)'
    deps:
      - dev:ui
      - dev:api
      - dev:mcp

  dev:ui:
    desc: 'Start UI development server (React / Vite)'
    cmds:
      - bun --filter @me-builder/web dev

  dev:api:
    desc: 'Start API development server (Bun.serve / Hono)'
    cmds:
      - bun --filter @me-builder/api dev

  dev:mcp:
    desc: 'Start MCP development server'
    cmds:
      - bun --filter @me-builder/mcp dev

  build:
    desc: 'Build all applications and packages'
    cmds:
      - bun --filter '*' build

  typecheck:
    desc: 'Run TypeScript typecheck on all applications and packages'
    cmds:
      - bun run typecheck

  lint:
    desc: 'Run Biome check on the codebase'
    cmds:
      - bun run lint

  lint:fix:
    desc: 'Fix Biome lint and format issues'
    cmds:
      - bun run lint:fix

  test:
    desc: 'Run tests using Vitest'
    cmds:
      - bun run test

  ci:
    desc: 'Run full CI checks locally (lint, typecheck, test, build)'
    cmds:
      - bun run ci

  deploy:preview:
    desc: 'Deploy all applications to preview environment via Wrangler'
    cmds:
      - bun --filter '*' deploy:preview

  deploy:production:
    desc: 'Deploy all applications to production environment via Wrangler'
    cmds:
      - bun --filter '*' deploy:production
