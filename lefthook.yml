pre-commit:
  commands:
    lint:
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    lint-md:
      glob: "*.md"
      run: bunx markdownlint-cli2 --fix {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    branch-name:
      run: |
        branch=$(git branch --show-current)
        if [[ ! $branch =~ ^(feature|bugfix|hotfix|chore|docs|refactor|test|usagi)/[a-zA-Z0-9\-]+$ ]] && [[ "$branch" != "main" ]]; then
          echo "Error: Branch name does not follow convention (feature/xxx, bugfix/xxx, usagi/xxx, etc.)"
          exit 1
        fi
    typecheck:
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,cts}"
      run: bun run typecheck:pre-push -- "{push_files}"
    test:
      glob: "*.{js,jsx,ts,tsx,mjs,mts,cjs,cts,sql}"
      run: bun run test:pre-push -- "{push_files}"

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
