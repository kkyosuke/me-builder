name = "me-builder-api"
main = "src/index.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]

# Secrets (vars には置かない / CDの`wrangler deploy --secrets-file`で配布する)
#   - LINE_CHANNEL_ACCESS_TOKEN: LINE Messaging API の呼び出しに使用
#   - LINE_CHANNEL_SECRET:       POST /api/line/webhook の x-line-signature 検証に使用 (必須)
#                                (未設定の場合は環境を問わず全リクエストを 401 で拒否する)
# ローカル開発では apps/api/.env (bun) もしくは apps/api/.dev.vars (wrangler dev) に設定する

[observability]
enabled = true

[[queues.producers]]
queue = "me-builder-webhook-queue-local"
binding = "WEBHOOK_QUEUE"

[[d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[vars]
ENVIRONMENT = "local"

[env.local]
name = "me-builder-api-local"

[[env.local.queues.producers]]
queue = "me-builder-webhook-queue-local"
binding = "WEBHOOK_QUEUE"

[[env.local.d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[env.local.vars]
ENVIRONMENT = "local"

[env.preview]
name = "me-builder-api-preview"
routes = [
  { pattern = "api.stg.kagami.kyosuke.dev", custom_domain = true }
]

[[env.preview.queues.producers]]
queue = "me-builder-webhook-queue-preview"
binding = "WEBHOOK_QUEUE"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "me-builder-db-preview"
database_id = "ef439301-0199-4c78-af5e-91fcc5be63bd"

[env.preview.vars]
ENVIRONMENT = "preview"

[env.production]
name = "me-builder-api-production"
routes = [
  { pattern = "api.kagami.kyosuke.dev", custom_domain = true }
]

[[env.production.queues.producers]]
queue = "me-builder-webhook-queue-production"
binding = "WEBHOOK_QUEUE"

[[env.production.d1_databases]]
binding = "DB"
database_name = "me-builder-db-production"
database_id = "6d11180b-3286-4b69-bd63-c7b60d768be1"

[env.production.vars]
ENVIRONMENT = "production"
