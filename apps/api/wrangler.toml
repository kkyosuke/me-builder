name = "me-builder-api"
main = "src/index.ts"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]

# Secrets (vars には置かない / CDの`wrangler deploy --secrets-file`で配布する)
#   - LINE_CHANNEL_ACCESS_TOKEN: LINE Messaging API の呼び出しに使用
#   - LINE_CHANNEL_SECRET:       POST /api/line/webhook の x-line-signature 検証に使用 (必須)
#                                (未設定の場合は環境を問わず全リクエストを 401 で拒否する)
# ローカル開発では apps/api/.env (bun) もしくは apps/api/.dev.vars (wrangler dev) に設定する

[observability]
enabled = true

# Cloudflareが自動で出す起動ログはHTTPの結果を表さない。middlewareの終端ログが
# method、path、status、所要時間を持つため、起動ログは出さない。
[observability.logs]
invocation_logs = false

[[queues.producers]]
queue = "me-builder-webhook-queue-local"
binding = "WEBHOOK_QUEUE"

[[queues.producers]]
queue = "me-builder-avatar-queue-local"
binding = "AVATAR_QUEUE"

[[r2_buckets]]
binding = "AVATAR_BUCKET"
bucket_name = "me-builder-avatar-local"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[[durable_objects.bindings]]
name = "ACCOUNT_DATA"
class_name = "AccountData"
script_name = "me-builder-worker-local"

[[durable_objects.bindings]]
name = "COMPATIBILITY_DATA"
class_name = "CompatibilityData"
script_name = "me-builder-worker-local"

[vars]
ENVIRONMENT = "local"

[env.local]
name = "me-builder-api-local"

[[env.local.queues.producers]]
queue = "me-builder-webhook-queue-local"
binding = "WEBHOOK_QUEUE"

[[env.local.queues.producers]]
queue = "me-builder-avatar-queue-local"
binding = "AVATAR_QUEUE"

[[env.local.r2_buckets]]
binding = "AVATAR_BUCKET"
bucket_name = "me-builder-avatar-local"

[env.local.images]
binding = "IMAGES"

[[env.local.d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[[env.local.durable_objects.bindings]]
name = "ACCOUNT_DATA"
class_name = "AccountData"
script_name = "me-builder-worker-local"

[[env.local.durable_objects.bindings]]
name = "COMPATIBILITY_DATA"
class_name = "CompatibilityData"
script_name = "me-builder-worker-local"

[env.local.vars]
ENVIRONMENT = "local"

[env.preview]
name = "me-builder-api-preview"
routes = [
  { pattern = "api.stg.kagami.kyosuke.dev", custom_domain = true }
]

[[env.preview.queues.producers]]
queue = "me-builder-webhook-queue-preview"
binding = "WEBHOOK_QUEUE"

[[env.preview.queues.producers]]
queue = "me-builder-avatar-queue-preview"
binding = "AVATAR_QUEUE"

[[env.preview.r2_buckets]]
binding = "AVATAR_BUCKET"
bucket_name = "me-builder-avatar-preview"

[env.preview.images]
binding = "IMAGES"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "me-builder-db-preview"
database_id = "8c25af7d-bc26-4b40-bbb4-1521c4af5a6e"

[[env.preview.durable_objects.bindings]]
name = "ACCOUNT_DATA"
class_name = "AccountData"
script_name = "me-builder-worker-preview"

[[env.preview.durable_objects.bindings]]
name = "COMPATIBILITY_DATA"
class_name = "CompatibilityData"
script_name = "me-builder-worker-preview"

[env.preview.vars]
ENVIRONMENT = "preview"

[env.production]
name = "me-builder-api-production"
routes = [
  { pattern = "api.kagami.kyosuke.dev", custom_domain = true }
]

[[env.production.queues.producers]]
queue = "me-builder-webhook-queue-production"
binding = "WEBHOOK_QUEUE"

[[env.production.queues.producers]]
queue = "me-builder-avatar-queue-production"
binding = "AVATAR_QUEUE"

[[env.production.r2_buckets]]
binding = "AVATAR_BUCKET"
bucket_name = "me-builder-avatar-production"

[env.production.images]
binding = "IMAGES"

[[env.production.d1_databases]]
binding = "DB"
database_name = "me-builder-db-production"
database_id = "6d11180b-3286-4b69-bd63-c7b60d768be1"

[[env.production.durable_objects.bindings]]
name = "ACCOUNT_DATA"
class_name = "AccountData"
script_name = "me-builder-worker-production"

[[env.production.durable_objects.bindings]]
