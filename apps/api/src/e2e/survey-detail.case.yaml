# API契約の正: docs/development/questionnaire-api.md
# 実行するテスト: apps/api/src/e2e/survey-list.test.ts
cases:
  - id: DETAIL-001
    in:
      method: GET
      path: /api/surveys/relationship-priority
      authorization: Bearer known-token
      setup:
        - migrationとquestionnaire seedを適用
    out:
      status: 200
      body:
        id: relationship-priority
        questionCount: 10
        firstQuestion:
          surveyQuestionId: sq-relationship-priority-01
          questionVersion: 1
          choices:
            - choiceId: no
              presentation:
                icon: circle-x
            - choiceId: yes
              presentation:
                icon: circle-check

  - id: DETAIL-002
    in:
      method: GET
      path: /api/surveys/missing
      authorization: Bearer known-token
    out:
      status: 404
      body:
        error: Survey not found
        reason: survey_not_found

  - id: DETAIL-003
    in:
      method: GET
      path: /api/surveys/relationship-priority
      authorization: Bearer known-token
      setup:
        - relationship-priorityのcloses_atを現在時刻に更新
    out:
      status: 409
      body:
        error: Survey closed
        reason: survey_closed
