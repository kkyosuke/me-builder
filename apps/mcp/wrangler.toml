name = "me-builder-mcp"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true


[[d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[vars]
ENVIRONMENT = "local"

[env.local]
name = "me-builder-mcp-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[env.local.vars]
ENVIRONMENT = "local"

[env.preview]
name = "me-builder-mcp-preview"
routes = [
  { pattern = "mcp.stg.kagami.kyosuke.dev", custom_domain = true }
]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "me-builder-db-preview"
database_id = "me-builder-db-preview-id"

[env.preview.vars]
ENVIRONMENT = "preview"

[env.production]
name = "me-builder-mcp-production"
routes = [
  { pattern = "mcp.kagami.kyosuke.dev", custom_domain = true }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "me-builder-db-production"
database_id = "me-builder-db-production-id"

[env.production.vars]
ENVIRONMENT = "production"
