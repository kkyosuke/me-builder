name = "me-builder-worker"
main = "src/index.ts"
compatibility_date = "2024-07-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[queues.consumers]]
queue = "me-builder-webhook-queue-local"

[[d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[vars]
ENVIRONMENT = "local"

[env.local]
name = "me-builder-worker-local"

[[env.local.queues.consumers]]
queue = "me-builder-webhook-queue-local"

[[env.local.d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[env.local.vars]
ENVIRONMENT = "local"

[env.preview]
name = "me-builder-worker-preview"

[[env.preview.queues.consumers]]
queue = "me-builder-webhook-queue-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "me-builder-db-preview"
database_id = "ef439301-0199-4c78-af5e-91fcc5be63bd"

[env.preview.vars]
ENVIRONMENT = "preview"

[env.production]
name = "me-builder-worker-production"

[[env.production.queues.consumers]]
queue = "me-builder-webhook-queue-production"

[[env.production.d1_databases]]
binding = "DB"
database_name = "me-builder-db-production"
database_id = "6d11180b-3286-4b69-bd63-c7b60d768be1"

[env.production.vars]
ENVIRONMENT = "production"
