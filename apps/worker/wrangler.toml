[[env.local.durable_objects.bindings]]
name = "ACCOUNT_DATA"
class_name = "AccountData"

[[env.local.durable_objects.bindings]]
name = "COMPATIBILITY_DATA"
class_name = "CompatibilityData"

[[env.local.d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[env.local.vars]
ENVIRONMENT = "local"

