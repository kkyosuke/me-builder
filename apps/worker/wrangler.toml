name = "me-builder-worker"
main = "src/index.ts"
compatibility_date = "2026-08-06"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[queues.consumers]]
queue = "me-builder-webhook-queue-local"
dead_letter_queue = "me-builder-webhook-dlq-local"

[[queues.producers]]
queue = "me-builder-chat-turn-queue-local"
binding = "CHAT_TURN_QUEUE"

[[durable_objects.bindings]]
name = "CONVERSATION_COORDINATOR"
class_name = "ConversationCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationCoordinator"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "me-builder-db-local"
database_id = "me-builder-db-local-id"

[vars]
ENVIRONMENT = "local"

[env.local]
name = "me-builder-worker-local"

[[env.local.queues.consumers]]
